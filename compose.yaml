# main.py in Docker on the Pi. Set up by scripts/pi_initial.sh; afterwards:
#   sudo docker compose up -d --build    # rebuild and restart after git pull
#   sudo docker compose logs -f
services:
  occupancy:
    build: .
    image: kmt-occupancy
    restart: unless-stopped
    # API_TOKEN and CONFIG_URL, shared with the systemd setup (scripts/install_pi.sh)
    env_file: /etc/kmt-occupancy.env
    # $$: expanded by the container's shell from env_file, not by compose
    command: ["sh", "-c", '[ -n "$$CONFIG_URL" ] || { echo "CONFIG_URL is empty: set it in /etc/kmt-occupancy.env, then docker compose up -d" >&2; exit 1; }; exec python /app/main.py --config "$$CONFIG_URL"']
    # Every camera (/dev/videoN, any N), present at start or plugged in later: the host's /dev
    # with access to V4L2 devices only (char major 81). With a "devices:" entry instead, a
    # missing camera stops the container from starting; main.py itself retries a camera.
    device_cgroup_rules:
      - "c 81:* rmw"
    ports:
      - "8080:8080" # local dashboard
    volumes:
      - state:/data
      - ./models:/data/models:ro # from scripts/export_model.sh
      - /dev:/dev

volumes:
  state:
